# TI-99/Sim custom keymap for Parsec
#
# Parsec controls on the Miyoo Mini:
#   D-Pad        = Move ship (Up, Down, Left, Right)
#   A (Space)    = FIRE (Lasers)
#   B (Ctrl)     = 1 (Lift 1: fine speed, essential for refueling)
#   X (Shift)    = 2 (Lift 2: medium cruising speed)
#   Y (Alt)      = 3 (Lift 3: high speed evasion)
#   L1 (E)       = Y (Answer "Y" to "PLAY AGAIN? (Y/N)")
#   R1 (T)       = N (Answer "N" to "PLAY AGAIN? (Y/N)")
#   L2 (Tab)     = FCTN+9 (BACK)
#   R2 (Bksp)    = FCTN+8 (REDO)
#   Start (Ret)  = ENTER
#   Select (RCtl)= P (Pause)

Space      = FIRE          # [A]
Left Ctrl  = 1             # [B] Lift 1
Left Shift = 2             # [X] Lift 2
Left Alt   = 3             # [Y] Lift 3
E          = Y             # [L1] Yes
T          = N             # [R1] No
Tab        = FCTN+9        # [L2] BACK
Backspace  = FCTN+8        # [R2] REDO
Return     = ENTER         # [Start]
Right Ctrl = P             # [Select]
