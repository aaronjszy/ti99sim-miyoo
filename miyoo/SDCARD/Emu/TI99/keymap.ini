# TI-99/Sim button layout for the Miyoo Mini.
#
#   <SDL key name> = <action>      # comment
#
# The Miyoo's buttons arrive as keyboard keys; the physical button is in brackets.
# Actions: FIRE, RESET, NONE, or a TI key (A-Z, 0-9, ENTER, SPACE, COMMA, PERIOD,
# SLASH, SEMICOLON, EQUALS), optionally with a modifier: FCTN+9, SHIFT+1, CTRL+C.
# D-pad (arrow keys) is the joystick and is not remapped here.
# Menu (Escape) quits the emulator.
#
# To check what a button sends, set TI_LOG_KEYS=1 in launch.sh and read ti99sim.log.

Space      = FIRE          # [A]
Left Ctrl  = 1             # [B]
Left Shift = 2             # [X]
Left Alt   = 3             # [Y]
E          = FCTN+EQUALS   # [L1] QUIT
T          = FCTN+8        # [R1] REDO
Tab        = SPACE         # [L2]
Backspace  = FCTN+9        # [R2] BACK
Return     = ENTER         # [Start]
Right Ctrl = P             # [Select]
