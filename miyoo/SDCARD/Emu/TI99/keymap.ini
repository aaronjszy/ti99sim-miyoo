# TI-99/Sim button layout for the Miyoo Mini.
#
#   <SDL key name> = <action>      # comment
#
# The Miyoo's buttons arrive as keyboard keys; the physical button is in brackets.
# Actions: FIRE, RESET, SAVE, LOAD, NONE, or a TI key (A-Z, 0-9, ENTER, SPACE,
# COMMA, PERIOD, SLASH, SEMICOLON, EQUALS), optionally with a modifier: FCTN+9,
# SHIFT+1, CTRL+C.
# D-pad (arrow keys) is the joystick and is not remapped here.
#
# Built-in Onion OS shortcuts:
#   Menu (tap)         = Quit emulator
#   Menu + R2 (or R1)  = Save state (per cartridge in saves/)
#   Menu + L2 (or L1)  = Load state
#   Menu + Select      = Reset console
#   Menu + Start       = Reset console
#
# To check what a button sends, set TI_LOG_KEYS=1 in launch.sh and read ti99sim.log.

Space      = FIRE          # [A]
Left Ctrl  = 1             # [B]
Left Shift = 2             # [X]
Left Alt   = Y             # [Y] "Yes" to prompts
E          = SPACE         # [L1] Secondary trigger (Parsec refuel, jump, thrust)
T          = N             # [R1] "No" to prompts
Tab        = FCTN+9        # [L2] BACK
Backspace  = FCTN+8        # [R2] REDO
Return     = ENTER         # [Start]
Right Ctrl = P             # [Select]
